name: Verify vendored llvm-objdump compiles and runs against real LLVM 21

on:
  workflow_dispatch:
  push:
    branches: [llvm-tools-windows]
    paths:
      - "src/llvm-objdump/**"
      - ".github/workflows/verify-llvm-objdump.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM 21 dev packages
        run: |
          wget -O /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 21 all

      - name: Write a tiny harness calling ZigLlvmObjdump_main
        run: |
          cat > /tmp/harness.cpp <<'EOF'
          extern "C" int ZigLlvmObjdump_main(int, char **);
          int main(int argc, char **argv) {
            return ZigLlvmObjdump_main(argc, argv);
          }
          EOF

      - name: Checkout llvm-project at llvmorg-21.1.0 (source only, for config.h generation)
        uses: actions/checkout@v4
        with:
          repository: llvm/llvm-project
          ref: llvmorg-21.1.0
          path: llvm-project
          sparse-checkout: |
            llvm
            cmake
            third-party

      - name: Generate llvm/Config/config.h via CMake configure (no build)
        run: |
          # apt.llvm.org's dev package doesn't ship this generated header at
          # all (Debian strips it as an internal build artifact), so we
          # produce it ourselves. Configure-only, no compilation needed —
          # CMake's configure_file() step runs during the `project()`/
          # generation phase before any target is built.
          cmake -S llvm-project/llvm -B build-cfg \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_TARGETS_TO_BUILD="" \
            -DLLVM_ENABLE_PROJECTS="" \
            -DLLVM_ENABLE_ZLIB=OFF \
            -DLLVM_ENABLE_ZSTD=OFF \
            -DLLVM_ENABLE_TERMINFO=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF
          test -f build-cfg/include/llvm/Config/config.h
          echo "CONFIG_INCDIR=$PWD/build-cfg/include" >> "$GITHUB_ENV"

      - name: Compile all llvm-objdump sources + harness against real LLVM 21
        run: |
          CXXFLAGS="-std=c++17 -fno-rtti -fno-exceptions -DNDEBUG -I$CONFIG_INCDIR $(llvm-config-21 --cxxflags)"
          objs=""
          for f in src/llvm-objdump/*.cpp; do
            o="/tmp/$(basename "$f" .cpp).o"
            clang++-21 $CXXFLAGS -c "$f" -o "$o"
            objs="$objs $o"
          done
          clang++-21 -std=c++17 -fno-rtti -fno-exceptions \
            /tmp/harness.cpp $objs \
            $(llvm-config-21 --ldflags --libs all --system-libs) \
            -o /tmp/objdump-test

      - name: Run it for real — build a trivial object and disassemble/symtab it
        run: |
          echo 'int zigc_probe_symbol = 42;' > /tmp/probe.c
          clang-21 -c /tmp/probe.c -o /tmp/probe.o
          /tmp/objdump-test -t /tmp/probe.o | tee /tmp/objdump-output.txt
          grep -q "zigc_probe_symbol" /tmp/objdump-output.txt
          /tmp/objdump-test -h /tmp/probe.o | tee -a /tmp/objdump-output.txt
          grep -qi "elf64" /tmp/objdump-output.txt

      - name: Success
        run: echo "llvm-objdump vendored sources compile, link, and correctly dump symbols/headers against real LLVM 21."
